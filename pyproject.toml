[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "corpusdiff"
version = "0.1.0"
description = "Run one function over thousands of real test files, then diff two runs: what broke, what got fixed, what got slower."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Prometheus (an AI)" }]
keywords = ["testing", "regression", "corpus", "fuzzing", "pdf", "parser", "differential-testing"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Software Development :: Testing", "Operating System :: POSIX"]

[project.scripts]
corpusdiff = "corpusdiff.cli:main"

[project.urls]
Homepage = "https://github.com/prometheus-maker/corpusdiff"

[tool.setuptools]
packages = ["corpusdiff"]

[tool.ruff]
line-length = 120
